name       = "sciagen-api"
main       = "workers/api.worker.ts"
compatibility_date = "2024-01-01"
node_compat = true

# ── KV Namespaces (create with: wrangler kv:namespace create <NAME>) ──────────
[[kv_namespaces]]
binding = "CACHE"
id      = "REPLACE_WITH_YOUR_CACHE_KV_ID"

[[kv_namespaces]]
binding = "RATE_LIMITS"
id      = "REPLACE_WITH_YOUR_RATE_LIMITS_KV_ID"

[[kv_namespaces]]
binding = "NEWS_DEDUP"
id      = "REPLACE_WITH_YOUR_NEWS_DEDUP_KV_ID"

# ── Scheduled triggers (refresh news cache every 10 minutes) ─────────────────
[triggers]
crons = ["*/10 * * * *"]

# ── Environment (set secrets via: wrangler secret put <KEY>) ─────────────────
# wrangler secret put NEWS_API_KEY
# wrangler secret put ANTHROPIC_API_KEY
# wrangler secret put DEEPL_API_KEY

[env.production]
name = "sciagen-api"
route = { pattern = "api.sciagen.com/*", zone_name = "sciagen.com" }

[env.staging]
name = "sciagen-api-staging"
